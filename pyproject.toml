[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chatapi"
version = "0.1.2"
description = "Thin Python wrapper around multiple LLM providers (OpenAI-compatible APIs and Google Gemini) for interactive chat and batch experiments."
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "google-genai>=1.0",
    "pandas>=2.0",
    "tqdm>=4.60",
    "pyparsing>=3.0",
]

[tool.setuptools.packages.find]
include = ["chatapi", "chatapi.*"]

[tool.setuptools.package-data]
"chatapi" = ["prompts/*.json", "prompts/*.txt"]
